<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill & Certification Tracker</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><header><p class="eyebrow">PERSONAL DEVELOPMENT</p><h1>Skill & Certification Tracker</h1><p>Keep track of what you're learning and the certifications you've earned.</p></header>
<section class="panel"><h2>Add a skill</h2><form id="skill-form"><label>Skill name<input name="name" required placeholder="e.g. Java"></label><label>Level<select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label>Notes<input name="notes" placeholder="What are you practising?"></label><button>Add skill</button></form><div id="skills" class="items"></div></section>
<section class="panel"><h2>Add a certification</h2><form id="cert-form"><label>Certification name<input name="name" required placeholder="e.g. Java Foundations"></label><label>Provider<input name="provider" placeholder="e.g. Oracle"></label><label>Completion date<input type="date" name="completionDate"></label><label>Expiry date<input type="date" name="expiryDate"></label><label>Status<select name="status"><option>Planned</option><option>In progress</option><option>Completed</option></select></label><button>Add certification</button></form><div id="certifications" class="items"></div></section><p id="message" role="status"></p></main><script src="app.js"></script></body></html>
